name: Build & Publish Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed Installable Release APK
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          cp debug.keystore /tmp/upload.jks
          keytool -changealias -keystore /tmp/upload.jks -storepass android -keypass android -alias androiddebugkey -destalias upload
          KEYSTORE_PATH=/tmp/upload.jks STORE_PASSWORD=android KEY_PASSWORD=android gradle :app:assembleRelease
          rm -f /tmp/upload.jks
          mkdir -p build/release-assets
          cp app/build/outputs/apk/release/app-release.apk build/release-assets/VaultZero-v1.0.0.apk
          cd build/release-assets
          sha256sum VaultZero-v1.0.0.apk > VaultZero-v1.0.0.apk.sha256

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-v1.0.0-APK
          path: |
            build/release-assets/VaultZero-v1.0.0.apk
            build/release-assets/VaultZero-v1.0.0.apk.sha256

      - name: Publish Latest GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VaultZero v1.0.0 — Zero-Knowledge Offline Android Vault"
          body_path: releases/v1.0.0.md
          make_latest: true
          files: |
            build/release-assets/VaultZero-v1.0.0.apk
            build/release-assets/VaultZero-v1.0.0.apk.sha256
