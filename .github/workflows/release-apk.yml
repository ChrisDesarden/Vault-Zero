name: Build & Publish Android APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Installable APK
        run: gradle :app:assembleDebug

      - name: Prepare Release Artifacts & SHA-256 Checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VaultZero-v1.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cd dist
          sha256sum VaultZero-v1.0.0.apk > VaultZero-v1.0.0.apk.sha256
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-v1.0.0-APK
          path: |
            dist/VaultZero-v1.0.0.apk
            dist/VaultZero-v1.0.0.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: "VaultZero v1.0.0 — Zero-Knowledge Offline Android Vault"
          body_path: releases/v1.0.0.md
          files: |
            dist/VaultZero-v1.0.0.apk
            dist/VaultZero-v1.0.0.apk.sha256
            dist/app-release.apk
            dist/app-debug.apk
